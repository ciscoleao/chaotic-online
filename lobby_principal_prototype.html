<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lobby Espacial — Pátio Central</title><script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script><style>html,body{margin:0;background:#050817;color:#dffcff;font-family:monospace;overflow:hidden}#info{position:fixed;z-index:5;top:12px;left:50%;transform:translateX(-50%);background:#08182bdf;border:1px solid #00eaff;border-radius:8px;padding:8px 14px;letter-spacing:1px;font-size:12px}canvas{image-rendering:pixelated}</style></head><body><div id="info">PÁTIO CENTRAL · WASD/SETAS para mover · E para interagir · F8 mapa completo</div><script>
const MAP={mapId:'lobby_principal',name:'Lobby Espacial',version:'1.0',dimensions:{width:1000,height:1000},spawnPoint:{x:500,y:650,direction:'down'},zones:[{id:'roleta',name:'ROLETA',description:'Sorteios e prêmios',type:'minigame',position:{x:150,y:150},size:{width:200,height:200},color:0xd12cff},{id:'portal_mundo',name:'PORTAL',description:'Toque = Escolher o Mundo',type:'teleport',position:{x:500,y:120},size:{width:200,height:150},color:0x00eaff},{id:'shop',name:'SHOP',description:'Pilhas e Itens',type:'store',position:{x:850,y:150},size:{width:200,height:200},color:0x00eaff},{id:'forja',name:'FORJA',description:'Upgrade de Costuras',type:'crafting',position:{x:150,y:500},size:{width:200,height:180},color:0xffa51f},{id:'deposito',name:'DEPÓSITO',description:'Armazenamento',type:'storage',position:{x:150,y:850},size:{width:200,height:200},color:0x269dff},{id:'missoes',name:'MISSÕES',description:'Diárias · Semanais · Eventos',type:'quest_board',position:{x:500,y:850},size:{width:250,height:150},color:0x00f0c8},{id:'leilao',name:'LEILÃO',description:'Compre e Venda',type:'market',position:{x:850,y:500},size:{width:200,height:180},color:0xd13cff},{id:'comunicacao',name:'CENTRO DE COMUNICAÇÃO',description:'Notícias · Eventos · Rankings',type:'communication',position:{x:850,y:850},size:{width:200,height:180},color:0x00aaff}],paths:[{type:'horizontal_corridor',y:500,startX:250,endX:750,width:80},{type:'vertical_corridor',x:500,startY:250,endY:750,width:80}]};
function tex(scene){let c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=64;x.fillStyle='#141b30';x.fillRect(0,0,64,64);x.strokeStyle='#273653';x.strokeRect(.5,.5,63,63);x.fillStyle='#202d49';for(let i=0;i<8;i++)x.fillRect(i*9+3,5,2,2);x.fillStyle='#18243b';x.fillRect(0,31,64,2);scene.textures.addCanvas('floor',c);let w=document.createElement('canvas'),q=w.getContext('2d');w.width=w.height=64;q.fillStyle='#111824';q.fillRect(0,0,64,64);q.fillStyle='#2d3a50';q.fillRect(3,3,58,58);q.strokeStyle='#00eaff';q.strokeRect(5,5,54,54);q.fillStyle='#53657c';q.fillRect(8,8,4,4);q.fillRect(52,52,4,4);scene.textures.addCanvas('wall',w)}
class Lobby extends Phaser.Scene{constructor(){super('Lobby')}preload(){tex(this)}create(){this.cameras.main.setBackgroundColor('#050817');this.cameras.main.setBounds(0,0,1000,1000);for(let y=0;y<1000;y+=64)for(let x=0;x<1000;x+=64)this.add.image(x+32,y+32,'floor');let g=this.add.graphics();g.fillStyle(0x203151);g.fillRect(250,460,500,80);g.fillRect(460,250,80,500);g.lineStyle(3,0x00eaff,.8);g.strokeRect(250,460,500,80);g.strokeRect(460,250,80,500);this.drawNucleus();MAP.zones.forEach(z=>this.zone(z));let exit=this.add.graphics().setDepth(5);exit.fillStyle(0x091525,1);exit.fillRect(460,940,80,60);exit.lineStyle(4,0x00eaff,1);exit.strokeRect(468,944,64,56);exit.fillStyle(0x00eaff,1);exit.fillRect(495,955,10,35);this.add.text(500,925,'SAÍDA SUL',{font:'bold 14px monospace',color:'#00eaff',stroke:'#000',strokeThickness:4}).setOrigin(.5).setDepth(8);this.player=this.add.rectangle(500,650,20,28,0xff315d).setDepth(20);this.player.setStrokeStyle(2,0xffffff);this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,E,F8');this.full=false;this.add.text(500,650,'',{});this.cameras.main.startFollow(this.player,true,.12,.12);this.cameras.main.setZoom(.72);}
drawNucleus(){let g=this.add.graphics().setDepth(4);g.fillStyle(0x111b32);g.fillCircle(500,500,130);g.lineStyle(12,0x008dff,1);g.strokeCircle(500,500,110);g.lineStyle(3,0x00f0ff,1);g.strokeCircle(500,500,90);g.fillStyle(0x00cfff);g.fillCircle(500,500,58);g.fillStyle(0x08152d);g.fillCircle(500,500,42);}
zone(z){let g=this.add.graphics().setDepth(3),x=z.position.x-z.size.width/2,y=z.position.y-z.size.height/2;g.fillStyle(0x0b1121,.98);g.fillRect(x,y,z.size.width,z.size.height);g.lineStyle(5,z.color,1);g.strokeRect(x+4,y+4,z.size.width-8,z.size.height-8);g.lineStyle(1,0x5d7394,1);g.strokeRect(x+14,y+14,z.size.width-28,z.size.height-28);this.add.text(z.position.x,y+22,z.name,{font:'bold 22px monospace',color:'#ffffff',stroke:'#000000',strokeThickness:5}).setOrigin(.5).setDepth(8);this.add.text(z.position.x,y+z.size.height-24,z.description,{font:'11px monospace',color:'#b9d6ef',stroke:'#000000',strokeThickness:3}).setOrigin(.5).setDepth(8);for(let i=0;i<4;i++){g.fillStyle=z.color;g.fillRect(x+22+i*18,y+z.size.height-48,9,3)}this.add.rectangle(z.position.x,z.position.y,z.size.width,z.size.height,0,0).setInteractive().on('pointerdown',()=>this.notice(z));}
notice(z){this.add.text(this.player.x,this.player.y-40,z.name+' · '+z.description,{font:'bold 12px monospace',color:'#fff',backgroundColor:'#07172ddd',padding:{x:8,y:6}}).setOrigin(.5).setDepth(30).setAlpha(1).setDuration?.(1200)}
update(){let dx=0,dy=0;if(this.keys.A.isDown||this.keys.LEFT.isDown)dx=-1;if(this.keys.D.isDown||this.keys.RIGHT.isDown)dx=1;if(this.keys.W.isDown||this.keys.UP.isDown)dy=-1;if(this.keys.S.isDown||this.keys.DOWN.isDown)dy=1;this.player.x=Phaser.Math.Clamp(this.player.x+dx*3,20,980);this.player.y=Phaser.Math.Clamp(this.player.y+dy*3,20,980);if(Phaser.Input.Keyboard.JustDown(this.keys.F8)){this.full=!this.full;if(this.full){this.cameras.main.stopFollow();this.cameras.main.setZoom(.58);this.cameras.main.centerOn(500,500)}else{this.cameras.main.startFollow(this.player,true,.12,.12);this.cameras.main.setZoom(.72)}}if(this.keys.E.isDown){let z=MAP.zones.find(z=>Phaser.Math.Distance.Between(this.player.x,this.player.y,z.position.x,z.position.y)<130);if(z)this.notice(z)}}}new Phaser.Game({type:Phaser.AUTO,width:innerWidth,height:innerHeight,backgroundColor:'#050817',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},physics:{default:'arcade',arcade:{debug:false}},scene:[Lobby]});
</script></body></html>
