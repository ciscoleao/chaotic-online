<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robô Costura-11 — Upgrade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#b7c9e5;font-family:Arial,sans-serif;color:#e8fbff;display:grid;place-items:center}.panel{width:min(1120px,96vw);background:#071923;border:2px solid #55e3ee;box-shadow:0 0 30px #00151dcc,inset 0 0 50px #0b526033;padding:22px;border-radius:12px}.head{display:flex;gap:18px;align-items:center;border-bottom:1px solid #28606b;padding-bottom:14px}.avatar{width:76px;height:76px;border:3px solid #5de5f0;border-radius:50%;display:grid;place-items:center;font-size:42px;background:#102c38}.title h1{margin:0;color:#9cf5ff;font:800 25px Georgia}.title p{margin:7px 0 0;font-size:13px}.stage{position:relative;display:grid;grid-template-columns:minmax(250px,1fr) 300px minmax(250px,1fr);gap:24px;align-items:center;min-height:450px}.svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}.col,.pack{position:relative;z-index:2}.col{display:flex;flex-direction:column;gap:12px}.pack{grid-column:2;grid-row:1;display:grid;place-items:center;height:280px}.robot{width:210px;height:260px;border:4px solid #82f1ff;border-radius:20px;background:#0f3340;display:grid;place-items:center;font-size:92px;box-shadow:0 0 25px #00eaff66,inset 0 0 30px #00eaff22}.card{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 12px;border:1px solid #ca536b;border-radius:11px;background:#0c2731}.card.ok{border-color:#62d58e}.icon{width:36px;height:36px;display:grid;place-items:center;border:1px solid #63dce9;border-radius:8px;background:#06151c;font-size:18px;flex:none}.info{flex:1;min-width:0}.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:8px;margin-top:8px;background:#031016;border:1px solid #356873;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#5bcfe2}.ok .bar i{background:#63dd8c}.num{min-width:44px;text-align:right;color:#ff9aa9;font:bold 12px monospace}.ok .num{color:#8ef3a9}.bottom{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bottom .card{min-height:52px}.wire{fill:none;stroke:#9af5ff;stroke-width:2}.glow{fill:none;stroke:#00dff055;stroke-width:9}.node{fill:#00f0ff}.foot{text-align:center;border-top:1px solid #28606b;padding-top:15px;color:#b8e9f0}@media(max-width:800px){.stage{grid-template-columns:1fr 1fr}.pack{grid-column:1/-1;grid-row:1}.col.left{grid-column:1;grid-row:2}.col.right{grid-column:2;grid-row:2}.bottom{grid-template-columns:1fr 1fr;grid-row:3}.robot{width:170px;height:190px;font-size:65px}}
</style></head><body><main class="panel"><header class="head"><div class="avatar">🤖</div><div class="title"><h1>ROBÔ COSTURA-11 <small>v.3</small></h1><p>🧵 UPGRADE DA MOCHILA — nível <b>0/5</b> · slots <b>5</b></p><em>Costuro bolsos extras em qualquer mochila! Traga os materiais do nível certo de Perim.</em></div></header><section id="stage" class="stage"><svg id="wires" class="svg"><g id="glows"></g><g id="lines"></g></svg><div id="left" class="col left"></div><div class="pack"><div id="backpack" class="robot">🤖</div></div><div id="right" class="col right"></div><div id="bottom" class="bottom"></div></section><footer class="foot">UPGRADE 1/5 — materiais do nível 1 · <button disabled>🔨 FAZER UPGRADE (+2 slots)</button></footer></main><script>
const materials=[['Couro Escamoso de Dractyl','🟫',7,10,'left'],['Teia Reforçada de Mandiblor','🕸️',3,10,'left'],['Cipó da Floresta da Vida','🌿',9,10,'left'],['Dente Lascado de um Magmon','🦷',10,10,'right'],['Garra Caída de um Mipediano','🪝',2,10,'right']];
function card(m){let [name,icon,cur,req,side]=m;let e=document.createElement('div');e.className='card '+(cur>=req?'ok':'');e.dataset.side=side;e.innerHTML=`<div class="icon">${icon}</div><div class="info"><div class="name">${name}</div><div class="bar"><i style="width:${Math.min(100,cur/req*100)}%"></i></div></div><div class="num">${Math.min(cur,req)}/${req}</div>`;return e}
function render(){let l=document.querySelector('#left'),r=document.querySelector('#right'),b=document.querySelector('#bottom');[l,r,b].forEach(x=>x.replaceChildren());materials.forEach(m=>(m[4]==='left'?l:r).append(card(m)));drawConnections()}
function rect(el,root){let a=el.getBoundingClientRect(),b=root.getBoundingClientRect();return{l:a.left-b.left,r:a.right-b.left,t:a.top-b.top,b:a.bottom-b.top,w:a.width,h:a.height}}
function drawConnections(){let root=document.querySelector('#stage'),svg=document.querySelector('#wires'),gl=document.querySelector('#glows'),ln=document.querySelector('#lines');let rr=root.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${rr.width} ${rr.height}`);gl.replaceChildren();ln.replaceChildren();let p=rect(document.querySelector('#backpack'),root);document.querySelectorAll('.card').forEach(c=>{let q=rect(c,root),right=c.dataset.side==='right',x1=right?p.r:p.l,y1=p.t+p.h/2,x2=right?q.l:q.r,y2=q.t+q.h/2,d=Math.max(45,Math.abs(x2-x1)*.42),c1=right?x1+d:x1-d,c2=right?x2-d:x2+d,dv=`M ${x1} ${y1} C ${c1} ${y1}, ${c2} ${y2}, ${x2} ${y2}`;let a=document.createElementNS('http://www.w3.org/2000/svg','path'),b=document.createElementNS('http://www.w3.org/2000/svg','path'),n=document.createElementNS('http://www.w3.org/2000/svg','circle');a.setAttribute('d',dv);a.classList.add('glow');b.setAttribute('d',dv);b.classList.add('wire');n.setAttribute('cx',x2);n.setAttribute('cy',y2);n.setAttribute('r',3);n.classList.add('node');gl.append(a);ln.append(b,n)})}window.addEventListener('resize',()=>requestAnimationFrame(drawConnections));new ResizeObserver(drawConnections).observe(document.querySelector('#stage'));render();</script></body></html>
